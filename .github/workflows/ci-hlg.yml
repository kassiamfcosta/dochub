name: CI Tag para HLG
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      release_type: ${{ steps.type.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependências
        run: |
          npm ci --ignore-scripts
          cd backend && npm ci --ignore-scripts
          cd ../frontend && npm ci --ignore-scripts
      - name: Tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
      - name: Tipo de release
        id: type
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PATCH="${TAG##*.}"
          if [ "$PATCH" -eq 0 ]; then echo "value=feature" >> $GITHUB_OUTPUT; else echo "value=hotfix" >> $GITHUB_OUTPUT; fi
      - name: Testes
        run: npm run test
      - name: Build
        run: npm run build
      - name: Empacotar backend
        run: |
          mkdir -p artifacts
          tar -czf artifacts/backend-${{ steps.tag.outputs.value }}.tar.gz -C backend dist package.json
      - name: Empacotar frontend
        run: |
          tar -czf artifacts/frontend-${{ steps.tag.outputs.value }}.tar.gz -C frontend dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doc-hub-${{ steps.tag.outputs.value }}
          path: artifacts
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push Docker backend
        run: |
          IMAGE_BACKEND=ghcr.io/${{ github.repository_owner }}/doc-hub-backend:${{ steps.tag.outputs.value }}
          docker build -t "$IMAGE_BACKEND" ./backend
          docker push "$IMAGE_BACKEND"
      - name: Build e push Docker frontend
        run: |
          IMAGE_FRONTEND=ghcr.io/${{ github.repository_owner }}/doc-hub-frontend:${{ steps.tag.outputs.value }}
          docker build -t "$IMAGE_FRONTEND" ./frontend
          docker push "$IMAGE_FRONTEND"
      - name: Criar release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_hlg:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: HLG
      url: ${{ steps.meta.outputs.url }}
    steps:
      - name: Metadados
        id: meta
        run: |
          if [ -n "${{ secrets.HLG_URL }}" ]; then echo "url=${{ secrets.HLG_URL }}" >> $GITHUB_OUTPUT; else echo "url=" >> $GITHUB_OUTPUT; fi
      - name: Deploy remoto
        if: ${{ secrets.HLG_DEPLOY_COMMAND != '' }}
        uses: appleboy/ssh-action@v0.1.19
        with:
          host: ${{ secrets.HLG_SSH_HOST }}
          username: ${{ secrets.HLG_SSH_USER }}
          key: ${{ secrets.HLG_SSH_KEY }}
          script: ${{ secrets.HLG_DEPLOY_COMMAND }}
          envs: TAG
        env:
          TAG: ${{ needs.build.outputs.tag }}
