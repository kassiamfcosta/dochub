# Somente o frontend (independe do backend estar em Docker ou rodando com npm)
#   cd frontend && docker compose up --build
# UI: http://localhost:4173 — a API deve estar acessível em VITE_API_URL (padrão: máquina host :3001)

name: doc-hub-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    container_name: doc_hub_frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
