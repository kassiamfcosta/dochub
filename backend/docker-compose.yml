# API + MySQL (stack independente do frontend)
#   cd backend && docker compose up --build
# Whisper (transcrição local): docker compose --profile speech up --build
#
# API: http://localhost:3001
# Copie .env.example para .env e preencha JWT_SECRET, ZELLO_API_KEY, etc.
# FRONTEND_URL no .env: use http://localhost:5173 (Vite) ou http://localhost:4173 (preview Docker)
#
# DATABASE_URL: no Kubernetes/cofre injete DATABASE_URL no pod (sem .env na imagem).
# Neste compose, a URL abaixo aponta para o serviço `mysql` da rede Docker — não use
# o mesmo .env de desenvolvimento no host (localhost) sem ajustar, senão o container
# não alcança o banco.

name: doc-hub-backend

services:
  mysql:
    image: mysql:8.0
    container_name: doc_hub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-405b7f9e}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zello_transcription_hub}
      MYSQL_USER: ${MYSQL_USER:-zello_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zello_password_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 20s
      retries: 15

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: doc_hub_whisper
    restart: unless-stopped
    profiles:
      - speech
    environment:
      ASR_MODEL: tiny
      ASR_ENGINE: openai_whisper
    ports:
      - "9000:9000"
    volumes:
      - whisper_cache:/root/.cache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/docs"]
      interval: 15s
      timeout: 60s
      retries: 20
      start_period: 120s
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_hub_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: mysql://${MYSQL_USER:-zello_user}:${MYSQL_PASSWORD:-zello_password_change_me}@mysql:3306/${MYSQL_DATABASE:-zello_transcription_hub}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
    command: sh -c "npm run db:push && npm run start"

volumes:
  mysql_data:
  whisper_cache:

networks:
  backend:
    driver: bridge
