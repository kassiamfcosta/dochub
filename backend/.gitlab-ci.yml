stages:
  - test
  - build
  - package
  - docker
  - deploy

.default_tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - when: never

variables:
  NODE_ENV: production
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

test:
  stage: test
  image: node:20
  rules:
    - !reference [.default_tag_rules, rules]
  script:
    - npm ci --ignore-scripts
    - npm run test

build:
  stage: build
  image: node:20
  rules:
    - !reference [.default_tag_rules, rules]
  script:
    - npm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 week

package_artifacts:
  stage: package
  image: alpine:3.19
  needs: ["build"]
  rules:
    - !reference [.default_tag_rules, rules]
  script:
    - mkdir -p artifacts
    - tar -czf artifacts/backend-${CI_COMMIT_TAG}.tar.gz dist package.json
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week

docker_image:
  stage: docker
  image: docker:latest
  services:
    - name: docker:dind
      command: ["--mtu=1460"]
  needs: ["build"]
  rules:
    - !reference [.default_tag_rules, rules]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG}" .
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG}"

release:
  stage: package
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["package_artifacts"]
  rules:
    - !reference [.default_tag_rules, rules]
  script:
    - release-cli create --name "Release ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}"

deploy_hlg:
  stage: deploy
  image: alpine:3.19
  needs: ["docker_image", "release"]
  environment:
    name: HLG
    url: $HLG_URL
  rules:
    - !reference [.default_tag_rules, rules]
  script:
    - apk add --no-cache openssh-client
    - echo "$HLG_SSH_KEY" > key.pem && chmod 600 key.pem
    - ssh -i key.pem -o StrictHostKeyChecking=no "$HLG_SSH_USER@$HLG_SSH_HOST" "export TAG=${CI_COMMIT_TAG}; ${HLG_DEPLOY_COMMAND}"

promote_prd:
  stage: deploy
  image: alpine:3.19
  needs: ["docker_image", "release"]
  environment:
    name: PRD
    url: $PRD_URL
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never
  script:
    - apk add --no-cache openssh-client
    - echo "$PRD_SSH_KEY" > key.pem && chmod 600 key.pem
    - ssh -i key.pem -o StrictHostKeyChecking=no "$PRD_SSH_USER@$PRD_SSH_HOST" "export TAG=${CI_COMMIT_TAG}; ${PRD_DEPLOY_COMMAND}"

