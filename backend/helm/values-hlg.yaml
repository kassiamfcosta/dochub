replicaCount: 1
fullnameOverride: "zello-hub-backend"
image:
  repository: harbor.zello.space/zello-hub/zello-hub-backend
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: harbor-zello

deployments:
  command: []
  args: []


nameOverride: ""

ingress:
  enabled: false
  className: "kong"
  annotations: {}
  hosts:
    - host: domain.zello.space
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: {}

livenessProbe:
  failureThreshold: 3
  httpGet:
    path: /health
    port: 3000
    scheme: HTTP
  initialDelaySeconds: 180
  periodSeconds: 2
  successThreshold: 1
  timeoutSeconds: 2

readinessProbe:
  failureThreshold: 3
  httpGet:
    path: /health
    port: 3000
    scheme: HTTP
  initialDelaySeconds: 180
  periodSeconds: 2
  successThreshold: 2
  timeoutSeconds: 2

virtualService:
  enabled: false
  hosts: "zello-hub-backend-hlg.zello.space"
  prefix: "/"

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 100m
    memory: 100Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

ExternalSecret:
  enable: true
  name: zellohub-backend-vault
  namespace: zello-hub
  secretStoreRef:
    name: cluster-secret-store-vault
    kind: ClusterSecretStore
  refreshInterval: "2m"
  target:
    name: zellohub-backend-vault
  dataFrom:
    key: hlg/zellohub-backend/

service:
  type: ClusterIP
  port: 3000
