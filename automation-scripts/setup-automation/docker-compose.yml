version: '3.8'

services:
  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: zello_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: zello_transcription_hub
      MYSQL_USER: zello_user
      MYSQL_PASSWORD: zello_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zello_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zello_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mysql://zello_user:zello_password_change_me@mysql:3306/zello_transcription_hub
      JWT_SECRET: ${JWT_SECRET:-c026586daedcac5ab782076a07abd236}
      JWT_EXPIRES_IN: 7d
      ZELLO_API_URL: ${ZELLO_API_URL}
      ZELLO_API_KEY: ${ZELLO_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - zello_network
    command: npm run dev

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zello_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - zello_network
    command: npm run dev -- --host

volumes:
  mysql_data:

networks:
  zello_network:
    driver: bridge
